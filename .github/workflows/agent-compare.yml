name: Agent compare

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10，与 daily-report 同一天的数据做并行对比
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      sectors:
        description: "板块名（空格分隔，留空跑全部）"
        required: false
        default: ""

concurrency:
  group: agent-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 空缓存下只抓一次，两侧共用候选，不影响 daily-report 的 Supabase 缓存。
      LLM_VERIFY_PROVIDER: ${{ secrets.LLM_VERIFY_PROVIDER }}
      DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
      DOUBAO_ENDPOINT: ${{ secrets.DOUBAO_ENDPOINT }}
      DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_ENDPOINT: ${{ secrets.DEEPSEEK_ENDPOINT }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Telegram feedback for Critic
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_KEY" ]]; then
            python feedback_bot.py --export --require-supabase || echo "::warning::Telegram 反馈导出失败，本次对比继续"
          fi

      - name: Run agent pipeline (dry-run, no push)
        shell: bash
        env:
          COMPARE_SECTORS: ${{ inputs.sectors }}
        run: |
          report_date="$(TZ=Asia/Shanghai date +%F)"
          echo "COMPARE_DATE=$report_date" >> "$GITHUB_ENV"
          args=(--all)
          if [[ -n "${COMPARE_SECTORS//[[:space:]]/}" ]]; then
            read -r -a sectors <<< "$COMPARE_SECTORS"
            args=(--sectors "${sectors[@]}")
          fi
          python -m agent.run_agent "${args[@]}" --dry-run --compare --date "$report_date"

      - name: Build compare report
        run: python -m agent.compare_report --trace agent_trace.jsonl --date "$COMPARE_DATE"

      - name: Append compare summary to job summary
        run: cat compare_report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-compare-${{ github.run_id }}
          path: |
            agent_trace.jsonl
            compare_report.md
            compare_report.json
            data/bad_cases.jsonl
          retention-days: 30
